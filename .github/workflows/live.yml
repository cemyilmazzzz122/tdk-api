name: Live source canary

# The library scrapes undocumented endpoints (TDK's JS bundle, gts-yeni, Kubbealtı,
# Nişanyan). This runs the strict live checks weekly so a source change shows up as a
# failed run (GitHub emails the repo owner) instead of silently empty results.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build
      - run: npm run test:live
